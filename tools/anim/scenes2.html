<html><head><style>
*{margin:0;padding:0}body{width:1080px;height:1920px;background:#f3efe6;overflow:hidden}
svg{display:block}
</style></head><body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const INK="#141414",OR="#f08a00",RED="#e23b3b",GR="#2f9e5b";
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const prog=(t,a,d)=>cl((t-a)/d);
function pt(p,a,l){const r=a*Math.PI/180;return [p[0]+l*Math.sin(r),p[1]+l*Math.cos(r)]}
function L(a,b,w){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${INK}" stroke-width="${w}" stroke-linecap="round"/>`}
function fig(o){
 const s=o.s||1,w=10*s,x=o.x,y=o.y,lean=o.lean||0;
 const hip=[x,y],neck=[x+lean*s,y-160*s],head=[neck[0]+(o.hx||0)*s,neck[1]-58*s],sh=[neck[0],neck[1]+18*s];
 let g=L(hip,neck,w);
 const limb=(p,a,l1,l2)=>{const m=pt(p,a[0],l1*s),e=pt(m,a[1],l2*s);g+=L(p,m,w)+L(m,e,w);return e};
 const lL=limb(hip,o.legL||[12,0],90,85),lR=limb(hip,o.legR||[-12,0],90,85);
 const hL=limb(sh,o.armL||[25,10],75,70),hR=limb(sh,o.armR||[-25,-10],75,70);
 g+=`<circle cx="${head[0]}" cy="${head[1]}" r="${48*s}" fill="#f3efe6" stroke="${INK}" stroke-width="${w}"/>`;
 const hx=head[0]+(o.look||0)*10*s,hy=head[1];
 const m=o.mood||"ok";
 if(m=="happy"||m=="calm"){g+=`<path d="M${hx-24*s},${hy-6*s} q${8*s},-${10*s} ${16*s},0 M${hx+8*s},${hy-6*s} q${8*s},-${10*s} ${16*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`}
 else {g+=`<circle cx="${hx-16*s}" cy="${hy-6*s}" r="${(m=="wow"?8:6)*s}" fill="${INK}"/><circle cx="${hx+16*s}" cy="${hy-6*s}" r="${(m=="wow"?8:6)*s}" fill="${INK}"/>`}
 if(m=="happy")g+=`<path d="M${hx-20*s},${hy+14*s} q${20*s},${22*s} ${40*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`;
 if(m=="calm"||m=="ok")g+=`<path d="M${hx-14*s},${hy+18*s} q${14*s},${10*s} ${28*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`;
 if(m=="sad")g+=`<path d="M${hx-16*s},${hy+24*s} q${16*s},-${14*s} ${32*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`;
 if(m=="wow")g+=`<ellipse cx="${hx}" cy="${hy+20*s}" rx="${9*s}" ry="${12*s}" fill="${INK}"/>`;
 if(m=="hmm")g+=`<path d="M${hx-12*s},${hy+20*s} l${26*s},-${5*s}" stroke="${INK}" stroke-width="${6*s}" stroke-linecap="round"/>`;
 return {svg:g,hL,hR,head};
}
function T(txt,x,y,size,t0,t,opt={}){
 const p=back(prog(t,t0,.35)),op=cl(prog(t,t0,.2));
 const sc=.6+.4*p;
 return `<g opacity="${op}" transform="translate(${x},${y}) scale(${sc}) translate(${-x},${-y})"><text x="${x}" y="${y}" font-family="Inter" font-weight="${opt.w||900}" font-size="${size}" fill="${opt.c||INK}" text-anchor="${opt.a||'middle'}" letter-spacing="-2">${txt}</text></g>`;
}
const O=s=>`<tspan fill="${OR}">${s}</tspan>`;
function handle(){return `<text x="540" y="1440" font-family="Inter" font-weight="600" font-size="30" fill="#9a958a" text-anchor="middle">@investeste.simplu</text>`}
function ground(y=1300){return `<line x1="120" y1="${y}" x2="960" y2="${y}" stroke="#d6d0c2" stroke-width="6" stroke-linecap="round"/>`}
function money(x,y,n,scale=1){let g="";for(let i=0;i<n;i++){g+=`<rect x="${x-70*scale}" y="${y-i*18*scale}" width="${140*scale}" height="${16*scale}" rx="4" fill="${GR}" stroke="${INK}" stroke-width="4"/>`}return g}
function box(x,y,wd,txt,t0,t,fill="#fff",col=INK){const p=back(prog(t,t0,.35));return `<g opacity="${cl(prog(t,t0,.2))}" transform="translate(${x},${y}) scale(${.5+.5*p})"><rect x="${-wd/2}" y="-55" width="${wd}" height="110" rx="26" fill="${fill}" stroke="${INK}" stroke-width="6"/><text x="0" y="17" font-family="Inter" font-weight="800" font-size="50" fill="${col}" text-anchor="middle">${txt}</text></g>`}
function arrow(x,y1,y2,t0,t){const p=ease(prog(t,t0,.3));if(p<=0)return"";const ye=y1+(y2-y1)*p;return L([x,y1],[x,ye],8)+(p>.95?`<path d="M${x-18},${y2-20} L${x},${y2} L${x+18},${y2-20}" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:"")}
function jar(x,y,fill){const h=260,w=200;return `<clipPath id="jc"><rect x="${x-w/2+8}" y="${y-h+30}" width="${w-16}" height="${h-38}" rx="30"/></clipPath><rect x="${x-w/2}" y="${y-h+40}" width="${w}" height="${h-40}" rx="40" fill="#fff" stroke="${INK}" stroke-width="8"/><rect clip-path="url(#jc)" x="${x-w/2}" y="${y-(h-50)*fill-8}" width="${w}" height="${(h-50)*fill+8}" fill="${OR}" opacity=".85"/><rect x="${x-w/2+20}" y="${y-h+10}" width="${w-40}" height="34" rx="10" fill="#d6d0c2" stroke="${INK}" stroke-width="6"/>`}


const S=[];
function total(v,t0,t){const p=cl(prog(t,t0,.3));return `<g opacity="${p}"><rect x="290" y="${1360}" width="500" height="80" rx="40" fill="#fff" stroke="${INK}" stroke-width="5"/><text x="540" y="1414" font-family="Inter" font-weight="900" font-size="46" fill="${RED}" text-anchor="middle">Total: ${Math.round(v).toLocaleString('ro-RO')} lei</text></g>`}
function cup(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><path d="M-30,-50 L30,-50 L24,20 L-24,20Z" fill="#fff" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><rect x="-34" y="-62" width="68" height="14" rx="6" fill="#6b4226" stroke="${INK}" stroke-width="5"/><path d="M-8,-80 q8,-12 0,-24 M8,-80 q8,-12 0,-24" stroke="#9a958a" stroke-width="4" fill="none"/></g>`}
function pkg(x,y,s=1){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-55" y="-45" width="110" height="90" rx="8" fill="#d9a65a" stroke="${INK}" stroke-width="6"/><path d="M-55,-10 H55 M0,-45 V45" stroke="${INK}" stroke-width="4"/></g>`}
function phone(x,y,s=1,inner=""){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-45" y="-80" width="90" height="160" rx="16" fill="#111" stroke="${INK}" stroke-width="5"/><rect x="-36" y="-66" width="72" height="128" rx="6" fill="#fff"/>${inner}</g>`}
function counterScene(title,sub,calc,add,from,t,prop){
 let g=T(title,540,420,88,.1,t)+T(`<tspan font-weight="600" fill="#5b574f">${sub}</tspan>`,540,520,52,.5,t,{w:600});
 g+=T(O(calc),540,660,96,1.2,t);
 return g+total(from+add*ease(prog(t,2.2,1.2)),.2,t);
}
// 1 hook
S.push({d:4.5,f:t=>{
 const F=fig({x:430,y:1120,s:1.2,mood:"wow",armL:[60,150],armR:[-35,-165]});
 let g=F.svg;
 for(let i=0;i<5;i++){const p=prog(t,1+i*.45,1.6);if(p>0&&p<1){const x=F.hL[0]+40+p*460,y=F.hL[1]-p*220+Math.sin(p*9+i)*40;g+=`<g transform="translate(${x},${y}) rotate(${p*200+i*30})"><rect x="-55" y="-28" width="110" height="56" rx="6" fill="${GR}" stroke="${INK}" stroke-width="4"/><text x="0" y="12" font-family="Inter" font-weight="900" font-size="30" fill="#fff" text-anchor="middle">100</text></g>`}}
 return ground(1300)+g+T("Unde dispar",540,420,104,.1,t)+T(O("1.000 de lei pe lună?"),540,545,84,.5,t);
}});
// 2 coffee
S.push({d:5.5,f:t=>{const sip=Math.sin(t*3)>.6;const F=fig({x:430,y:1120,s:1.1,mood:"happy",armR:sip?[-20,-160]:[-30,-110]});
 return ground(1300)+F.svg+cup(F.hR[0]-10,F.hR[1]+10,.9)+counterScene("Cafeaua de la birou","15 lei, în fiecare zi lucrătoare","20 × 15 = 300 lei",300,0,t);}});
// 3 delivery
S.push({d:5.5,f:t=>{const F=fig({x:380,y:1120,s:1.1,mood:"happy",armL:[80,80],armR:[-80,-80]});
 const n=Math.min(8,Math.floor(prog(t,.6,2.4)*8)+1);let g="";for(let i=0;i<n;i++)g+=pkg(700+(i%3)*110-(Math.floor(i/3)%2)*55,1250-Math.floor(i/3)*85,.75);
 return ground(1300)+F.svg+g+counterScene("Livrările","2 comenzi pe săptămână, câte 50 lei","8 × 50 = 400 lei",400,300,t);}});
// 4 subscriptions
S.push({d:5.5,f:t=>{const F=fig({x:400,y:1120,s:1.1,mood:"hmm",look:1,armR:[-35,-165]});
 const subs=["Streaming","Muzică","Sală","Aplicație"];let g="";
 subs.forEach((s,i)=>{const p=back(prog(t,.8+i*.3,.35));g+=`<g opacity="${cl(prog(t,.8+i*.3,.2))}" transform="translate(${760},${900+i*95}) scale(${p})"><rect x="-150" y="-36" width="300" height="72" rx="18" fill="#fff" stroke="${INK}" stroke-width="5"/><text x="-125" y="12" font-family="Inter" font-weight="700" font-size="34" fill="${INK}">${s}</text><text x="125" y="12" font-family="Inter" font-weight="800" font-size="34" fill="${RED}" text-anchor="end">40</text></g>`});
 return ground(1300)+F.svg+g+counterScene("Abonamente uitate","pe care nici nu le mai folosești","4 × 40 = 160 lei",160,700,t);}});
// 5 just 20 lei
S.push({d:6,f:t=>{const F=fig({x:430,y:1120,s:1.1,mood:t<3.6?"happy":"wow",armL:[60,100],armR:[-60,-100]});
 let g=F.svg;const v=t<3.6?860+140*ease(prog(t,2.2,1.2)):1000;
 let txt=counterScene("„Doar 20 de lei”","gustări, nimicuri, chestii din coș","7 × 20 = 140 lei",0,0,t).replace(/<g opacity="[^"]*"><rect x="290"[\s\S]*$/,"");
 g+=txt+total(v,.2,t);
 if(t>3.6){const p=back(prog(t,3.6,.4));g+=`<g transform="translate(540,1000) scale(${p}) rotate(-6)"><rect x="-300" y="-90" width="600" height="180" rx="26" fill="${RED}"/><text x="0" y="-12" font-family="Inter" font-weight="900" font-size="64" fill="#fff" text-anchor="middle">1.000 lei / lună</text><text x="0" y="56" font-family="Inter" font-weight="800" font-size="48" fill="#fff" text-anchor="middle">= 12.000 lei / an</text></g>`}
 return ground(1300)+g;}});
// 6 cut half
S.push({d:5.5,f:t=>{const F=fig({x:300,y:1120,s:1,mood:"calm",armL:[90,90]});
 const p=ease(prog(t,1.4,1));let g=T("Nu trebuie să tai tot.",540,420,80,.1,t)+T(O("Taie jumătate."),540,530,96,.6,t);
 g+=`<rect x="420" y="780" width="500" height="110" rx="20" fill="${RED}" opacity="${1-p*.75}" stroke="${INK}" stroke-width="5"/><rect x="420" y="780" width="${500-250*p}" height="110" rx="20" fill="${GR}" opacity="${p}" stroke="${INK}" stroke-width="5"/><text x="670" y="854" font-family="Inter" font-weight="900" font-size="52" fill="#fff" text-anchor="middle">${p<.5?"1.000 lei":""}</text>`;
 g+=T(`Rămân ${O("500 lei")} pe lună.`,540,690,70,2.6,t);
 return ground(1300)+F.svg+g;}});
// 7 OKX
S.push({d:7.5,f:t=>{const F=fig({x:330,y:1120,s:1,mood:"happy",armR:[-120,-100]});
 let g=T("Îi pui deoparte automat,",540,400,70,.1,t)+T("în ziua salariului.",540,490,70,.4,t);
 g+=T(`Eu pun o parte în ${O("crypto")},`,540,620,58,1.4,t,{w:800})+T("cu cumpărare recurentă pe OKX.",540,695,52,1.7,t,{w:700});
 const ph=phone(F.hR[0]+10,F.hR[1]-20,.7,`<text x="0" y="-20" font-family="Inter" font-weight="800" font-size="20" fill="${INK}" text-anchor="middle">Lunar</text><text x="0" y="10" font-family="Inter" font-weight="900" font-size="24" fill="${OR}" text-anchor="middle">automat</text><text x="0" y="40" font-family="Inter" font-weight="900" font-size="26" fill="${GR}" text-anchor="middle">✓</text>`);
 g+=jar(780,1290,.1+.75*ease(prog(t,2.4,3.5)));
 const cta=back(prog(t,3.2,.4));g+=`<g opacity="${cl(prog(t,3.2,.2))}" transform="translate(560,790) scale(${cta})"><rect x="-220" y="-50" width="440" height="100" rx="26" fill="${OR}"/><text x="0" y="16" font-family="Inter" font-weight="900" font-size="46" fill="#111" text-anchor="middle">Link-ul e în bio</text></g>`;
 g+=`<g opacity="${cl(prog(t,3.5,.4))}" font-family="Inter" font-weight="500" font-size="26" fill="#8a857a" text-anchor="middle"><text x="540" y="1370">Întâi un fond de urgență. Crypto e volatil, poți pierde bani.</text><text x="540" y="1408">Colaborare cu OKX. Bonus de până la 400 € pentru conturi noi,</text><text x="540" y="1446">se aplică condiții. Nu e sfat financiar.</text></g>`;
 return ground(1300)+F.svg+ph+g;}});
// 8 question
S.push({d:6.5,f:t=>{const wave=Math.sin(t*6)*25;const F=fig({x:840,y:1150,s:.85,mood:"happy",armR:[-150+wave,-170+wave]});
 let g=T("Pe ce se duc cei mai",470,400,74,.1,t)+T(O("mulți bani la tine?"),470,495,74,.4,t);
 [["A","livrări"],["B","cafea și mâncare în oraș"],["C","abonamente"],["D","cumpărături din impuls"]].forEach((o,i)=>{const t0=1+i*.35,p=back(prog(t,t0,.35));g+=`<g opacity="${cl(prog(t,t0,.2))}" transform="translate(${110+(1-p)*-60},${660+i*130})"><circle cx="40" cy="-18" r="42" fill="${OR}"/><text x="40" y="0" font-family="Inter" font-weight="900" font-size="52" fill="#fff" text-anchor="middle">${o[0]}</text><text x="110" y="0" font-family="Inter" font-weight="700" font-size="50" fill="${INK}">${o[1]}</text></g>`});
 g+=T("Scrie litera în comentarii 👇",470,1230,52,2.8,t,{w:700});
 return ground(1300)+F.svg+g+handle();}});
function draw(i,t){document.getElementById("s").innerHTML=S[i].f(t)}
function durs(){return S.map(s=>s.d)}
</script></body></html>
