<html><head><style>
*{margin:0;padding:0}body{width:1080px;height:1920px;background:#f3efe6;overflow:hidden}
svg{display:block}
</style></head><body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const INK="#141414",OR="#f08a00",RED="#e23b3b",GR="#2f9e5b";
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const prog=(t,a,d)=>cl((t-a)/d);
function pt(p,a,l){const r=a*Math.PI/180;return [p[0]+l*Math.sin(r),p[1]+l*Math.cos(r)]}
function L(a,b,w){return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${INK}" stroke-width="${w}" stroke-linecap="round"/>`}
function fig(o){
 const s=o.s||1,w=10*s,x=o.x,y=o.y,lean=o.lean||0;
 const hip=[x,y],neck=[x+lean*s,y-160*s],head=[neck[0]+(o.hx||0)*s,neck[1]-58*s],sh=[neck[0],neck[1]+18*s];
 let g=L(hip,neck,w);
 const limb=(p,a,l1,l2)=>{const m=pt(p,a[0],l1*s),e=pt(m,a[1],l2*s);g+=L(p,m,w)+L(m,e,w);return e};
 const lL=limb(hip,o.legL||[12,0],90,85),lR=limb(hip,o.legR||[-12,0],90,85);
 const hL=limb(sh,o.armL||[25,10],75,70),hR=limb(sh,o.armR||[-25,-10],75,70);
 g+=`<circle cx="${head[0]}" cy="${head[1]}" r="${48*s}" fill="#f3efe6" stroke="${INK}" stroke-width="${w}"/>`;
 const hx=head[0]+(o.look||0)*10*s,hy=head[1];
 const m=o.mood||"ok";
 if(m=="happy"||m=="calm"){g+=`<path d="M${hx-24*s},${hy-6*s} q${8*s},-${10*s} ${16*s},0 M${hx+8*s},${hy-6*s} q${8*s},-${10*s} ${16*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`}
 else {g+=`<circle cx="${hx-16*s}" cy="${hy-6*s}" r="${(m=="wow"?8:6)*s}" fill="${INK}"/><circle cx="${hx+16*s}" cy="${hy-6*s}" r="${(m=="wow"?8:6)*s}" fill="${INK}"/>`}
 if(m=="happy")g+=`<path d="M${hx-20*s},${hy+14*s} q${20*s},${22*s} ${40*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`;
 if(m=="calm"||m=="ok")g+=`<path d="M${hx-14*s},${hy+18*s} q${14*s},${10*s} ${28*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`;
 if(m=="sad")g+=`<path d="M${hx-16*s},${hy+24*s} q${16*s},-${14*s} ${32*s},0" stroke="${INK}" stroke-width="${6*s}" fill="none" stroke-linecap="round"/>`;
 if(m=="wow")g+=`<ellipse cx="${hx}" cy="${hy+20*s}" rx="${9*s}" ry="${12*s}" fill="${INK}"/>`;
 if(m=="hmm")g+=`<path d="M${hx-12*s},${hy+20*s} l${26*s},-${5*s}" stroke="${INK}" stroke-width="${6*s}" stroke-linecap="round"/>`;
 return {svg:g,hL,hR,head};
}
function T(txt,x,y,size,t0,t,opt={}){
 const p=back(prog(t,t0,.35)),op=cl(prog(t,t0,.2));
 const sc=.6+.4*p;
 return `<g opacity="${op}" transform="translate(${x},${y}) scale(${sc}) translate(${-x},${-y})"><text x="${x}" y="${y}" font-family="Inter" font-weight="${opt.w||900}" font-size="${size}" fill="${opt.c||INK}" text-anchor="${opt.a||'middle'}" letter-spacing="-2">${txt}</text></g>`;
}
const O=s=>`<tspan fill="${OR}">${s}</tspan>`;
function handle(){return `<text x="540" y="1440" font-family="Inter" font-weight="600" font-size="30" fill="#9a958a" text-anchor="middle">@investeste.simplu</text>`}
function ground(y=1300){return `<line x1="120" y1="${y}" x2="960" y2="${y}" stroke="#d6d0c2" stroke-width="6" stroke-linecap="round"/>`}
function money(x,y,n,scale=1){let g="";for(let i=0;i<n;i++){g+=`<rect x="${x-70*scale}" y="${y-i*18*scale}" width="${140*scale}" height="${16*scale}" rx="4" fill="${GR}" stroke="${INK}" stroke-width="4"/>`}return g}
function box(x,y,wd,txt,t0,t,fill="#fff",col=INK){const p=back(prog(t,t0,.35));return `<g opacity="${cl(prog(t,t0,.2))}" transform="translate(${x},${y}) scale(${.5+.5*p})"><rect x="${-wd/2}" y="-55" width="${wd}" height="110" rx="26" fill="${fill}" stroke="${INK}" stroke-width="6"/><text x="0" y="17" font-family="Inter" font-weight="800" font-size="50" fill="${col}" text-anchor="middle">${txt}</text></g>`}
function arrow(x,y1,y2,t0,t){const p=ease(prog(t,t0,.3));if(p<=0)return"";const ye=y1+(y2-y1)*p;return L([x,y1],[x,ye],8)+(p>.95?`<path d="M${x-18},${y2-20} L${x},${y2} L${x+18},${y2-20}" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`:"")}
function jar(x,y,fill){const h=260,w=200;return `<clipPath id="jc"><rect x="${x-w/2+8}" y="${y-h+30}" width="${w-16}" height="${h-38}" rx="30"/></clipPath><rect x="${x-w/2}" y="${y-h+40}" width="${w}" height="${h-40}" rx="40" fill="#fff" stroke="${INK}" stroke-width="8"/><rect clip-path="url(#jc)" x="${x-w/2}" y="${y-(h-50)*fill-8}" width="${w}" height="${(h-50)*fill+8}" fill="${OR}" opacity=".85"/><rect x="${x-w/2+20}" y="${y-h+10}" width="${w-40}" height="34" rx="10" fill="#d6d0c2" stroke="${INK}" stroke-width="6"/>`}

const S=[];
// 1 hook
S.push({d:4.5,f:t=>{
 const bob=Math.sin(t*3)*4;
 const F=fig({x:540,y:1120+bob,s:1.25,mood:"sad",look:0,hx:0,lean:6,armL:[-35,-80],armR:[35,80]});
 const w=[F.hL[0]+(F.hR[0]-F.hL[0])/2,F.hL[1]];
 let g=F.svg+`<rect x="${w[0]-70}" y="${w[1]-10}" width="140" height="80" rx="12" fill="#8b5a2b" stroke="${INK}" stroke-width="6"/><path d="M${w[0]-70},${w[1]+10} h140" stroke="${INK}" stroke-width="5"/>`;
 const mp=prog(t,1.3,2.5);
 if(mp>0){const mx=w[0]+mp*220,my=w[1]-mp*320+Math.sin(t*14)*16,fl=Math.abs(Math.sin(t*22));g+=`<g transform="translate(${mx},${my})"><ellipse cx="0" cy="0" rx="10" ry="14" fill="#6b5d4d"/><ellipse cx="-16" cy="-4" rx="18" ry="${4+10*fl}" fill="#b9ad98" stroke="${INK}" stroke-width="3"/><ellipse cx="16" cy="-4" rx="18" ry="${4+10*fl}" fill="#b9ad98" stroke="${INK}" stroke-width="3"/></g>`}
 return ground(1300)+g+T("Nu-ți ajung banii",540,430,96,.1,t)+T(O("de la o lună la alta?"),540,550,84,.6,t);
}});
// 2 payday then gone
S.push({d:5.5,f:t=>{
 const j=t<2.2?Math.abs(Math.sin(t*5))*60*prog(t,.3,.2):0;
 const drain=ease(prog(t,2.8,2));
 const F=fig({x:380,y:1120-j,s:1.1,mood:t<2.6?"happy":"wow",armL:t<2.6?[135,150]:[70,150],armR:t<2.6?[-135,-150]:[-70,-150],legL:j>10?[30,-20]:[12,0],legR:j>10?[-30,20]:[-12,0]});
 const n=Math.round(14*(1-drain))+1;
 const val=Math.round(5000-(5000-312)*drain);
 let g=F.svg+money(720,1270,n,1.1)+`<text x="720" y="${1250-n*20-20}" font-family="Inter" font-weight="900" font-size="54" fill="${drain>.9?RED:GR}" text-anchor="middle">${val.toLocaleString('ro-RO')} lei</text>`;
 const items=[["chirie",-1,-1],["mâncare",1,-1],["livrări",-1,.2],["abonamente",1,.3]];
 items.forEach((it,i)=>{const p=ease(prog(t,2.9+i*.35,1.1));if(p>0&&p<1){g+=`<text x="${720+it[1]*(120+250*p)}" y="${1180-i*40-260*p}" opacity="${1-p*.6}" font-family="Inter" font-weight="800" font-size="44" fill="${RED}" text-anchor="middle">-${it[0]}</text>`}});
 return ground(1300)+g+T("Pe 1: vine salariul.",540,430,82,.1,t)+T(O("Pe 10: unde s-au dus?"),540,550,82,2.6,t);
}});
// 3 problem is order
S.push({d:4.5,f:t=>{
 const F=fig({x:540,y:1130,s:1.25,mood:t<2.4?"hmm":"wow",look:1,armL:[25,10],armR:t<2.4?[-30,160]:[-165,-175]});
 let g=F.svg;
 if(t>2.4){const p=back(prog(t,2.4,.4));g+=`<g transform="translate(${F.head[0]+110},${F.head[1]-120}) scale(${p})"><circle cx="0" cy="0" r="44" fill="#ffd84d" stroke="${INK}" stroke-width="6"/><rect x="-18" y="40" width="36" height="26" rx="6" fill="#bbb" stroke="${INK}" stroke-width="5"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return L([70*Math.cos(r),70*Math.sin(r)-10],[92*Math.cos(r),92*Math.sin(r)-10],6)}).join("")}</g>`}
 return ground(1300)+g+T("Problema nu e mereu",540,430,84,.1,t)+T("salariul.",540,540,84,.4,t)+T(`E ${O("ordinea")}.`,540,680,110,2.4,t);
}});
// 4 most people
S.push({d:6,f:t=>{
 let g=T("Cum fac cei mai mulți:",540,400,76,.1,t);
 g+=box(540,540,520,"Salariu",.5,t)+arrow(540,595,645,1.0,t)+box(540,700,520,"Cheltuieli",1.3,t)+arrow(540,755,805,1.8,t)+box(540,860,760,"Economisesc ce rămâne",2.1,t);
 if(t>3.4){const p=back(prog(t,3.4,.4));g+=`<g transform="translate(790,960) rotate(-10) scale(${p})"><rect x="-120" y="-50" width="240" height="100" rx="16" fill="#fff" stroke="${RED}" stroke-width="8"/><text x="0" y="20" font-family="Inter" font-weight="900" font-size="60" fill="${RED}" text-anchor="middle">0 lei</text></g>`}
 const F=fig({x:300,y:1150,s:.8,mood:t>3.4?"sad":"ok",armL:t>3.6?[120,-160]:[25,10],armR:t>3.6?[-120,160]:[-25,-10]});
 return ground(1300)+F.svg+g;
}});
// 5 those who succeed
S.push({d:6,f:t=>{
 let g=T("Cum fac cei care reușesc:",540,400,76,.1,t);
 g+=box(540,540,520,"Salariu",.4,t)+arrow(540,595,645,.9,t)+box(540,700,640,"Pun deoparte 10%",1.2,t,"#fff3dd",OR)+arrow(540,755,805,1.7,t)+box(540,860,600,"Cheltuiesc restul",2.0,t);
 const cp=prog(t,3.2,1.0),fill=.12*ease(prog(t,4.1,.5));
 const F=fig({x:330,y:1150,s:.8,mood:"happy",armR:[-120,-100]});
 g+=jar(760,1290,fill);
 if(cp>0&&cp<1){const x=F.hR[0]+(760-F.hR[0])*cp,y=F.hR[1]-260*Math.sin(Math.PI*cp)+(1110-F.hR[1])*cp;g+=`<circle cx="${x}" cy="${y}" r="26" fill="${OR}" stroke="${INK}" stroke-width="5"/>`}
 return ground(1300)+F.svg+g;
}});
// 6 numbers
S.push({d:6.5,f:t=>{
 const m=Math.min(12,Math.max(1,Math.floor(1+11*prog(t,1.6,3.4))));
 const sum=500*m;
 let g=T(`10% din 5.000 lei = ${O("500 lei")}`,540,400,64,.1,t)+T("pe lună, automat, în ziua salariului.",540,480,46,.4,t,{w:600,c:"#5b574f"});
 g+=`<text x="540" y="640" font-family="Inter" font-weight="800" font-size="56" fill="${INK}" text-anchor="middle" opacity="${cl(prog(t,1.4,.3))}">Luna ${m}</text>`;
 g+=`<text x="540" y="790" font-family="Inter" font-weight="900" font-size="150" fill="${OR}" text-anchor="middle" opacity="${cl(prog(t,1.4,.3))}">${sum.toLocaleString('ro-RO')} lei</text>`;
 g+=jar(760,1290,.12+.85*ease(prog(t,1.6,3.4)));
 const br=Math.sin(t*2)*4;
 const F=fig({x:330,y:1262+br,s:.85,mood:"calm",legL:[78,-95],legR:[-78,95],armL:[30,75],armR:[-30,-75]});
 g+=F.svg+`<text x="540" y="1380" font-family="Inter" font-weight="500" font-size="28" fill="#9a958a" text-anchor="middle" opacity="${cl(prog(t,5,.5))}">Exemplu simplu, fără dobândă sau randament.</text>`;
 return ground(1300)+g;
}});
// 7 question
S.push({d:6.5,f:t=>{
 const wave=Math.sin(t*6)*25;
 const F=fig({x:820,y:1150,s:.85,mood:"happy",armR:[-150+wave,-170+wave],armL:[25,10]});
 let g=T("Tu cât pui deoparte",470,400,78,.1,t)+T(O("în fiecare lună?"),470,500,78,.4,t);
 [["A","nimic, nu rămâne"],["B","sub 10%"],["C","între 10 și 20%"],["D","peste 20%"]].forEach((o,i)=>{const t0=1+i*.35,p=back(prog(t,t0,.35));g+=`<g opacity="${cl(prog(t,t0,.2))}" transform="translate(${130+ (1-p)*-60},${660+i*130})"><circle cx="40" cy="-18" r="42" fill="${OR}"/><text x="40" y="0" font-family="Inter" font-weight="900" font-size="52" fill="#fff" text-anchor="middle">${o[0]}</text><text x="110" y="0" font-family="Inter" font-weight="700" font-size="54" fill="${INK}">${o[1]}</text></g>`});
 g+=T("Scrie litera în comentarii 👇",470,1230,52,2.8,t,{w:700});
 return ground(1300)+F.svg+g+handle();
}});
function draw(i,t){document.getElementById("s").innerHTML=S[i].f(t)}
function durs(){return S.map(s=>s.d)}
</script></body></html>
